<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rota Express - Home</title>

    <!-- Ligação ao CSS -->
    <link rel="stylesheet" href="Main.css">
    
    <!-- Favicon (ícone na aba do navegador) -->
    <link rel="icon" type="image/x-icon" href="images/shoppingcart_77968.ico">
</head>
<body>

    <header>

        <!-- LOGOTIPO ROTA EXPRESS -->
        <img src="images/Rota_Express.png" alt="Logo Rota Express" class="logo">
        <nav>
            <a href="home.html">Início</a>
            <a href="Explorar.html">Explorar</a>
            <a href="Pedidos.html">Pedidos</a>
            <a href="TornaTeParceiro.html">Torna-te Parceiro</a>
            <a href="Perfil.html">Perfil</a>
            <a href="Contactos.html">Contactos</a>

            <!-- Link do Carrinho com o ícone .ico -->
            <a href="#" class="cart-link">
                <img src="images/shoppingcart_77968.ico" alt="Ícone Carrinho" class="cart-icon">
                Carrinho
            </a>
        </nav>

    </header>

    <main>

        <!-- APRESENTAÇÃO -->
        <section class="hero">

            <h1>A tua comida, mais rápido e perto de ti!</h1>

            <p>
                Descobre restaurantes e lojas perto de ti.
            </p>

            <!-- MORADA -->
            <div class="address">

                <input
                    type="text"
                    placeholder="Introduz a tua morada de entrega"
                >

                <button>
                    Explorar
                </button>

            </div>

        </section>


        <!-- CATEGORIAS -->
        <section class="categories">

            <h2>Explora por categoria</h2>

            <div class="category-list">

                <div class="category">
                    <img src="images/hamburgerimage.jpg" alt="Ícone Hambúrguer" class="categorias-icon">
                    <h3>Hambúrgueres</h3>
                </div>

                <div class="category">
                    <img src="images/pizzaimage.jpg" alt="Ícone Pizza" class="categorias-icon">
                    <h3>Pizza</h3>
                </div>

                <div class="category">
                    <img src="images/sushiimage.jpg" alt="Ícone Sushi" class="categorias-icon">      
                    <h3>Sushi</h3>
                </div>

                <div class="category">
                    <img src="images/padariaimage.jpg" alt="Ícone Padaria" class="categorias-icon">      
                    <h3>Padarias</h3>
                </div>

            </div>

        </section>

    </main>

    <!-- Ligação ao JS -->
    <script src="Main.js"></script>
</body>
</html>
